name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migrate_sync_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          if [ -f go.mod ]; then
            go mod tidy
            git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum are not tidy. Run 'go mod tidy' locally." && exit 1)
          fi

      - name: Run go vet
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "No go.mod found, skipping go vet"
          fi

      - name: Run tests
        run: |
          if [ -f go.mod ]; then
            go test -race -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "No go.mod found, skipping tests"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          fail_ci_if_error: false

      - name: Build binary
        run: |
          if [ -f go.mod ]; then
            go build -v ./...
          else
            echo "No go.mod found, skipping build"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: |
          if [ -f go.mod ]; then
            staticcheck ./...
          else
            echo "No go.mod found, skipping staticcheck"
          fi
